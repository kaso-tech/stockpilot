name: StockPilot quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: stockpilot
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: pnpm check
      - name: Tests
        run: pnpm test
      - name: Apply migrations on MySQL
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/stockpilot
        run: pnpm exec drizzle-kit migrate
      - name: Database integration tests
        env:
          TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/stockpilot
        run: pnpm test:db
      - name: Tenant scope audit
        run: node scripts/audit-tenant-scope.mjs --strict
      - name: Migration journal check
        run: node scripts/check-migrations.mjs
      - name: Production build
        run: pnpm build
